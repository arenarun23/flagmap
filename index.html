<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffe3ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="국기친구들">
<title>세계 국기 친구들</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff4e6; --bg2:#ffe9f1;
  --pink:#ffd6e5; --pink-d:#ff9cc0;
  --mint:#d9f5e8; --mint-d:#7fd6ae;
  --lav:#e8e0ff;  --lav-d:#a898f0;
  --sky:#d8ecff;  --ink:#5b4b6b;
}
*{word-break:keep-all;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{
  font-family:'Gowun Dodum','Jua','Noto Sans KR',sans-serif;color:var(--ink);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  padding:2.2vmin;overflow:hidden;
}
.app{height:100%;display:grid;gap:2.2vmin;grid-template-columns:3fr 2fr;grid-template-rows:1fr 1.35fr}
.card{border-radius:4vmin;box-shadow:0 1vmin 3vmin rgba(150,110,170,.18);position:relative;overflow:hidden}

/* 왼쪽: 국기 */
.flag-pane{grid-row:1/3;background:var(--pink);display:flex;align-items:center;justify-content:center;padding:3vmin 3vmin 14vmin}
.flag-frame{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.flag-frame img{max-width:100%;max-height:100%;border-radius:2.4vmin;box-shadow:0 1.2vmin 3vmin rgba(120,80,120,.25);border:1vmin solid #fff;background:#fff;animation:pop .5s ease}
.flag-frame .emoji{font-size:30vmin;line-height:1}
.welcome{text-align:center;font-family:'Jua',sans-serif}
.welcome .globe{font-size:24vmin;animation:float 3s ease-in-out infinite}
.welcome p{font-size:5vmin;margin:1vmin 0}
@keyframes pop{0%{transform:scale(.6) rotate(-4deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes float{50%{transform:translateY(-2vmin)}}

.dock{position:absolute;left:0;right:0;bottom:2.4vmin;display:flex;align-items:center;justify-content:center;gap:3vmin}
.mic{
  width:12vmin;height:12vmin;min-width:80px;min-height:80px;border:none;border-radius:50%;font-size:6vmin;cursor:pointer;
  background:linear-gradient(145deg,#ffb6d2,#b9a8ff);color:#fff;box-shadow:0 1vmin 2.4vmin rgba(160,100,200,.4);
}
.mic.on{animation:pulse 1s infinite;background:linear-gradient(145deg,#ff8fb8,#ff6f9f)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,111,159,.6)}100%{box-shadow:0 0 0 4vmin rgba(255,111,159,0)}}
.small:disabled,.mic:disabled,.chip:disabled{opacity:.4;cursor:default}
.small{width:8.5vmin;height:8.5vmin;min-width:56px;min-height:56px;border:none;border-radius:50%;font-size:4vmin;cursor:pointer;background:#fff;box-shadow:0 .6vmin 1.6vmin rgba(150,110,170,.25)}
.status{position:absolute;top:2.2vmin;left:50%;transform:translateX(-50%);background:#fff;border-radius:5vmin;padding:1vmin 3vmin;font-size:2.8vmin;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 .6vmin 1.6vmin rgba(150,110,170,.2)}

/* 오른쪽 위: 이름 */
.name-pane{background:var(--mint);display:flex;flex-direction:row;align-items:center;justify-content:center;gap:2vmin;text-align:center;padding:2vmin 2vmin 4vmin;cursor:pointer;font-family:'Jua',sans-serif}
.names{flex:1;min-width:0;container-type:inline-size}
.map{flex:0 0 48%;aspect-ratio:4/3;background:#cfe8ff;border-radius:3vmin;overflow:hidden;border:.8vmin solid #fff;box-shadow:0 .8vmin 2vmin rgba(100,140,180,.25);cursor:zoom-in}
.map svg{width:100%;height:100%;display:block}
.ko{font-size:min(9vmin,calc(94cqw / var(--n)));line-height:1.15;color:#3f8f6c;white-space:nowrap}
.en{font-size:min(5.6vmin,12cqw);margin-top:1vmin;color:#7a6a8a;line-height:1.2}
.name-pane .hint{position:absolute;left:3vmin;bottom:1.4vmin;font-size:2.4vmin;opacity:.55}

/* 오른쪽 아래: 설명 */
.desc-pane{background:var(--lav);display:flex;flex-direction:column;padding:3vmin}
.desc{flex:1;overflow:auto;font-size:min(3.8vmin,3.4vw);line-height:1.6;background:rgba(255,255,255,.55);border-radius:3vmin;padding:2.4vmin 3vmin}
.read{margin-top:2vmin;border:none;border-radius:5vmin;padding:1.8vmin;font-family:'Jua',sans-serif;font-size:4.4vmin;color:#fff;background:linear-gradient(145deg,#b9a8ff,#8fb4ff);box-shadow:0 .8vmin 2vmin rgba(130,110,220,.35);cursor:pointer}
.read:disabled{opacity:.45}

/* 나라 둘러보기 */
.sheet{position:fixed;inset:0;background:rgba(255,244,230,.97);z-index:10;display:none;flex-direction:column;padding:2.5vmin}
.sheet.open{display:flex}
.gear{position:absolute;top:1.6vmin;right:1.6vmin;width:6.5vmin;height:6.5vmin;min-width:44px;min-height:44px;font-size:3.2vmin;opacity:.8}
.vlist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1.2vmin}
.vlist h3{margin:1vmin 0 0;font-family:'Jua',sans-serif;font-size:3.2vmin}
.vbtn{border:none;border-radius:2.2vmin;padding:1.6vmin 2vmin;text-align:left;background:#fff;font-size:2.8vmin;color:var(--ink);box-shadow:0 .5vmin 1.2vmin rgba(150,110,170,.2);cursor:pointer}
.vbtn.sel{background:var(--mint);outline:.5vmin solid var(--mint-d)}
.vbtn small{display:block;opacity:.6;font-size:2.2vmin}
.sheet header{display:flex;justify-content:space-between;align-items:center;font-family:'Jua',sans-serif;font-size:4.4vmin;margin-bottom:1.5vmin}
.sheet header button{border:none;border-radius:50%;width:8vmin;height:8vmin;font-size:4vmin;background:var(--pink);cursor:pointer}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(18vmin,1fr));gap:1.6vmin;align-content:start;padding:.5vmin}
.chip{background:#fff;border:none;border-radius:2.4vmin;padding:1.2vmin;cursor:pointer;box-shadow:0 .6vmin 1.4vmin rgba(150,110,170,.2);font-family:'Jua',sans-serif;font-size:2.6vmin;color:var(--ink)}
.chip img{width:100%;aspect-ratio:3/2;object-fit:contain;padding:.5vmin;border-radius:1vmin;display:block;margin-bottom:.8vmin;background:#f3eefc}

@media (orientation:portrait){
  .app{grid-template-columns:1fr;grid-template-rows:1.3fr .6fr 1fr}
  .flag-pane{grid-row:auto}
}
</style>
</head>
<body>
<div class="app">
  <section class="card flag-pane">
    <button class="small gear" id="gear" title="목소리 고르기">⚙️</button>
    <div class="status" id="status">🎤 버튼을 누르고 나라 이름을 말해 보세요!</div>
    <div class="flag-frame" id="flag">
      <div class="welcome"><div class="globe">🌍</div><p>어느 나라가 궁금해요?</p></div>
    </div>
    <div class="dock">
      <button class="small" id="browse" title="나라 둘러보기">🗺️</button>
      <button class="mic" id="mic" title="말하기">🎤</button>
      <button class="small stop" id="stop" title="멈춤" disabled>⏹️</button>
      <button class="small" id="random" title="아무 나라">🎲</button>
    </div>
  </section>

  <section class="card name-pane" id="namePane">
    <div class="names">
      <div class="ko" id="ko" style="--n:4">나라 이름</div>
      <div class="en" id="en">Country</div>
    </div>
    <div class="map" id="map" title="누르면 크게/작게">
      <svg id="svg" viewBox="0 0 360 180" preserveAspectRatio="xMidYMid meet">
        <path id="land" fill="#fffaf0" stroke="#e4d6c4" stroke-width=".3" vector-effect="non-scaling-stroke"/>
        <path id="hl" fill="#ff9cc0" stroke="#ff5f9a" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        <circle id="pin" r="3" fill="#ff5f9a" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke" display="none"/>
        <circle id="ring" r="3" fill="none" stroke="#ff5f9a" stroke-width="1.5" vector-effect="non-scaling-stroke" display="none"><animate attributeName="r" id="ringA" values="3;9" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.4s" repeatCount="indefinite"/></circle>
      </svg>
    </div>
    <div class="hint">👆 이름을 누르면 말해요</div>
  </section>

  <section class="card desc-pane">
    <div class="desc" id="desc">마이크를 누르고 "프랑스"처럼 말해 보세요. 국기와 이야기가 나와요!</div>
    <button class="read" id="read" disabled>🔊 읽어주기</button>
  </section>
</div>

<div class="sheet" id="voiceSheet">
  <header><span>🗣️ 목소리 고르기</span><button id="closeVoice">✖</button></header>
  <div class="vlist" id="vlist"></div>
</div>

<div class="sheet" id="sheet">
  <header><span>🗺️ 나라를 골라 보세요</span><button id="closeSheet">✖</button></header>
  <div class="grid" id="grid"></div>
</div>

<script>
// [ISO코드, 한글, 영어, 별칭(비슷하게 들리는 말), 설명]
const C = [
['kr','대한민국','South Korea',['한국','남한','코리아','사우스코리아'],'우리가 사는 나라예요. 수도는 서울이에요. 김치와 불고기가 맛있고, 봄에는 벚꽃, 가을에는 단풍이 아주 예뻐요.'],
['jp','일본','Japan',['재팬'],'우리나라 바로 옆에 있는 섬나라예요. 수도는 도쿄예요. 초밥이 유명하고, 하얀 눈이 쌓이는 후지산이 있어요.'],
['cn','중국','China',['차이나'],'사람이 아주 많이 사는 큰 나라예요. 수도는 베이징이에요. 귀여운 판다와 아주 긴 만리장성이 있어요.'],
['tw','대만','Taiwan',['타이완'],'따뜻한 섬나라예요. 수도는 타이베이예요. 동그란 알갱이가 들어간 버블티가 처음 만들어진 곳이에요.'],
['mn','몽골','Mongolia',['몽고'],'드넓은 초원이 펼쳐진 나라예요. 수도는 울란바토르예요. 말을 잘 타고, 둥근 천막집 게르에서 살아요.'],
['kp','북한','North Korea',['조선'],'우리나라 북쪽에 있는 나라예요. 수도는 평양이에요. 우리와 같은 한반도에 있어요.'],
['us','미국','United States',['아메리카','유에스에이','유에스','합중국'],'땅이 아주 넓은 나라예요. 수도는 워싱턴 디씨예요. 뉴욕 바다에는 커다란 자유의 여신상이 서 있어요.'],
['ca','캐나다','Canada',[],'빨간 단풍잎이 그려진 국기를 가진 나라예요. 수도는 오타와예요. 달콤한 메이플 시럽이 유명하고 겨울에 눈이 많이 와요.'],
['mx','멕시코','Mexico',[],'수도는 멕시코시티예요. 맛있는 타코와 커다란 모자 솜브레로가 유명해요. 신나는 음악 마리아치도 있어요.'],
['cu','쿠바','Cuba',[],'카리브해에 있는 섬나라예요. 수도는 아바나예요. 알록달록한 옛날 자동차와 신나는 음악이 유명해요.'],
['jm','자메이카','Jamaica',[],'따뜻한 카리브해의 섬나라예요. 수도는 킹스턴이에요. 번개처럼 빠른 달리기 선수 우사인 볼트의 고향이에요.'],
['br','브라질','Brazil',['브라질리아'],'남아메리카에서 가장 큰 나라예요. 수도는 브라질리아예요. 축구를 아주 잘하고, 아마존 열대우림에는 신기한 동물이 많아요.'],
['ar','아르헨티나','Argentina',[],'남아메리카의 나라예요. 수도는 부에노스아이레스예요. 축구 선수 메시의 나라이고, 탱고 춤이 유명해요.'],
['cl','칠레','Chile',[],'아주 길쭉하게 생긴 나라예요. 수도는 산티아고예요. 바닷가를 따라 위아래로 길게 뻗어 있어요.'],
['pe','페루','Peru',[],'수도는 리마예요. 높은 산 위에 옛 도시 마추픽추가 있어요. 복슬복슬한 알파카와 라마도 살아요.'],
['co','콜롬비아','Colombia',[],'수도는 보고타예요. 향긋한 커피가 아주 유명하고, 알록달록한 꽃도 많이 키워요.'],
['gb','영국','United Kingdom',['잉글랜드','유케이','브리튼','영국나라'],'수도는 런던이에요. 커다란 시계탑 빅벤이 있고, 왕과 왕비가 사는 궁전이 있어요. 빨간 이층 버스도 유명해요.'],
['ie','아일랜드','Ireland',[],'초록 들판이 끝없이 펼쳐진 나라예요. 수도는 더블린이에요. 행운을 주는 네잎클로버가 이 나라의 상징이에요.'],
['fr','프랑스','France',[],'수도는 파리예요. 하늘 높이 솟은 에펠탑이 있어요. 바삭한 크루아상과 바게트 빵이 맛있어요.'],
['de','독일','Germany',['저머니'],'수도는 베를린이에요. 자동차를 아주 잘 만들고, 소시지와 빵이 맛있어요. 동화책 속 같은 성도 많아요.'],

['be','벨기에','Belgium',[],'수도는 브뤼셀이에요. 달콤한 초콜릿과 바삭한 와플이 아주 유명해요.'],
['ch','스위스','Switzerland',[],'수도는 베른이에요. 눈 덮인 알프스산이 있고, 시계와 초콜릿을 잘 만들어요.'],
['at','오스트리아','Austria',[],'수도는 빈이에요. 아름다운 음악가 모차르트가 태어난 나라예요. 음악의 나라라고 불러요.'],
['it','이탈리아','Italy',[],'수도는 로마예요. 피자와 스파게티가 처음 만들어진 곳이에요. 기울어진 피사의 사탑이 있어요.'],
['es','스페인','Spain',[],'수도는 마드리드예요. 축구를 아주 좋아하고, 빨간 옷을 입고 추는 플라멩코 춤이 유명해요.'],
['pt','포르투갈','Portugal',[],'수도는 리스본이에요. 바다를 건너 모험을 많이 한 나라예요. 축구 선수 호날두의 나라이기도 해요.'],
['gr','그리스','Greece',[],'수도는 아테네예요. 올림픽이 처음 시작된 나라예요. 하얀 집에 파란 지붕이 있는 바닷가 마을이 예뻐요.'],
['se','스웨덴','Sweden',[],'수도는 스톡홀름이에요. 노벨상을 주는 나라이고, 조립하는 가구로 유명해요.'],

['tr','튀르키예','Turkey',['터키','투르키예','튀르키예'],'수도는 앙카라예요. 하늘에 열기구가 둥실둥실 떠 있는 풍경이 유명해요. 쫀득한 아이스크림도 있어요.'],

const norm = s => s.toLowerCase().replace(/[\s.,!?'"~\-]/g,'');
const index = [];
C.forEach(c=>{
  [c[1],c[2],...c[3]].forEach(a=>{ const n=norm(a); if(n) index.push([n,c]); });
});
index.sort((a,b)=>b[0].length-a[0].length);

function findCountry(texts){
  for(const t of texts){
    const n = norm(t);
    for(const [a,c] of index) if(n.includes(a)) return c;
  }
  return null;
}

let current = null;
const synth = window.speechSynthesis;

// ---- 목소리 고르기: 삼성/여성 목소리를 먼저 찾아서 사용 ----
let allVoices = [];
function loadVoices(){ allVoices = synth.getVoices(); }
loadVoices(); synth.onvoiceschanged = loadVoices;
let vtry = 0; const vpoll = setInterval(()=>{ loadVoices(); if(allVoices.length || ++vtry>20) clearInterval(vpoll); }, 500);
const vkey = v => v.voiceURI || v.name;
function vscore(v, lang){
  const t = (v.name+' '+v.voiceURI).toLowerCase();
  let sc = 0;
  if(/samsung|삼성|smt/.test(t)) sc += 60;
  if(/female|woman|여성|여자|yuna|유나|sora|소라|heami|sunhi|sun-hi|seoyeon|ism|kab|kac/.test(t)) sc += 30;
  if(/(^|[^a-z])male|남성|남자|man\b/.test(t) && !/female/.test(t)) sc -= 60;
  if(v.localService) sc += 10;
  if(v.lang.replace('_','-').toLowerCase() === lang.toLowerCase()) sc += 20;
  return sc;
}
function pickVoice(lang){
  const pre = lang.slice(0,2).toLowerCase();
  const list = allVoices.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(pre));
  if(!list.length) return null;
  const saved = localStorage.getItem('voice_'+pre);
  if(saved){ const m = list.find(v=>vkey(v)===saved); if(m) return m; }
  return list.sort((a,b)=>vscore(b,lang)-vscore(a,lang))[0];
}
function renderVoices(){
  loadVoices();
  const html = [['ko','한국어 목소리','ko-KR','안녕하세요! 브라질에 대해 알려 줄게요.'],['en','영어 목소리','en-US','Hello! This is Brazil.']].map(([pre,title,lang,sample])=>{
    const list = allVoices.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(pre));
    const cur = pickVoice(lang);
    const info = cur ? `지금 쓰는 목소리: <b>${cur.name}</b> (${cur.lang})` : '기기 기본 목소리를 쓰고 있어요 (정상이에요 👍)';
    return `<h3>${title}</h3><div style="font-size:2.4vmin">${info} · 목록 ${list.length}개</div>` + (list.length ? list.map(v=>`<button class="vbtn ${cur&&vkey(v)===vkey(cur)?'sel':''}" data-pre="${pre}" data-k="${vkey(v)}" data-s="${sample}" data-l="${lang}">${v.name}<small>${v.lang}${v.localService?' · 기기 안 목소리':''}</small></button>`).join('') : '<div>목소리를 찾지 못했어요</div>');
  }).join('') + `<h3>이 기기의 전체 목소리 (${allVoices.length}개)</h3>` + (allVoices.length ? allVoices.map(v=>`<div style="font-size:2.2vmin">${v.name} · ${v.lang}${v.localService?' · local':''}</div>`).join('') : '<div style="font-size:2.4vmin">크롬이 목소리 목록을 하나도 주지 않았어요.</div>') + '<button class="vbtn" id="koTest">🔊 한국어로 말해 보기 (기본 목소리)</button><h3>목소리가 이상하면?</h3><div style="font-size:2.6vmin;line-height:1.5">갤럭시 설정 → 일반 → 언어 → <b>텍스트 음성 변환</b> → 기본 엔진을 <b>Samsung 텍스트 음성 변환</b>으로 바꾸고, 한국어 음성(여성)을 내려받은 뒤 크롬을 다시 켜 주세요.</div>';
  $('vlist').innerHTML = html;
}
$('gear').onclick = ()=>{ renderVoices(); $('voiceSheet').classList.add('open'); };
$('closeVoice').onclick = ()=>{ $('voiceSheet').classList.remove('open'); stopSpeak(); };
$('vlist').onclick = e=>{
  if(e.target.id==='koTest'){ stopSpeak(); const u=new SpeechSynthesisUtterance('안녕하세요. 브라질은 남아메리카에 있는 나라예요.'); u.lang='ko-KR'; synth.speak(u); return; }
  const b = e.target.closest('.vbtn'); if(!b) return;
  localStorage.setItem('voice_'+b.dataset.pre, b.dataset.k);
  renderVoices(); stopSpeak(); say(b.dataset.s, b.dataset.l);
};

let speaking = 0, gen = 0, muteUntil = 0, want = false;
const busy = ()=> speaking>0 || want;
function refresh(){
  const b = busy();
  $('mic').disabled = speaking>0;                 // 말하는 중에는 마이크 대기
  $('browse').disabled = $('random').disabled = b;
  $('read').disabled = b || !current;
  $('stop').disabled = !b;
}
function say(text, lang, rate, onend){
  const g = gen;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;                       // 속도·높이는 기본값(1) 그대로 둠
  const sv = localStorage.getItem('voice_'+lang.slice(0,2));
  const vv = sv && allVoices.find(v=>vkey(v)===sv);   // 직접 고른 목소리만 사용
  if(vv){ u.voice = vv; u.lang = vv.lang; }
  const done = ()=>{ if(g!==gen) return; speaking--; muteUntil = Date.now()+900; refresh(); onend&&onend(); };
  u.onend = done; u.onerror = done;
  speaking++; refresh();
  synth.speak(u);
}
function speak(text, lang){ say(text, lang); }
function stopSpeak(){ gen++; speaking = 0; synth.cancel(); refresh(); }
function speakName(c){
  stopSpeak();
  speak(c[1],'ko-KR');
  speak(c[2],'en-US');
}
// 오른쪽 위(이름) → 오른쪽 아래(설명) 순서로 읽기
function speakAll(c){
  speakName(c);
  say(c[4], 'ko-KR');
}
function readDesc(){
  if(!current || busy()) return;
  say(current[1]+'. '+current[4], 'ko-KR');
}

let mapZoom = true;
function drawMap(c){
  const g = c && GEO[c[0]]; if(!g) return;
  const [lat,lng,z,a3] = g, cx = lng+180, cy = 90-lat;
  $('hl').setAttribute('d', LAND[a3]||'');
  [$('pin'),$('ring')].forEach(e=>{ e.setAttribute('cx',cx); e.setAttribute('cy',cy); e.removeAttribute('display'); });
  const r = Math.max(.6, (mapZoom ? z : 160)/55);
  $('pin').setAttribute('r', r*.45); $('ringA').setAttribute('values', (r*.45)+';'+(r*1.8));
  if(mapZoom){
    const w = z, h = z*.75;
    const x = Math.min(Math.max(cx-w/2,0),360-w), y = Math.min(Math.max(cy-h/2,0),180-h);
    $('svg').setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
  } else $('svg').setAttribute('viewBox','0 0 360 180');
}
$('map').onclick = e=>{ e.stopPropagation(); mapZoom=!mapZoom; $('map').style.cursor = mapZoom?'zoom-out':'zoom-in'; drawMap(current); };

function show(c, say=true){
  current = c;
  const box = $('flag');
  box.innerHTML='';
  const img = new Image();
  img.alt = c[1]+' 국기';
  img.onerror = ()=>{ box.innerHTML=`<div class="emoji">${emojiFlag(c[0])}</div>`; };
  img.src = flagURL(c[0]);
  box.appendChild(img);
  $('ko').textContent = c[1];
  $('ko').style.setProperty('--n', Math.max(c[1].length,3));
  drawMap(c);
  $('en').textContent = c[2];
  $('desc').textContent = c[4];
  status('🎉 '+c[1]+'!');
  if(say) speakAll(c); else refresh();
}

// 음성 인식
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function setMic(on){ listening=on; $('mic').classList.toggle('on',on); $('mic').textContent = on?'👂':'🎤'; refresh(); }

// 한 번 켜면 계속 듣기 (끌 때까지 권한 창이 다시 안 뜨게)
function listen(){
  if(!SR){ status('이 브라우저는 음성 인식이 안 돼요. 크롬으로 열어 주세요 🗺️'); return; }
  if(want){ want=false; rec && rec.stop(); setMic(false); status('🎤 버튼을 누르면 다시 들어요'); return; }
  if(speaking>0) return;
  want = true; refresh();
  startRec();
}
function startRec(){
  rec = new SR();
  rec.lang='ko-KR'; rec.maxAlternatives=5; rec.interimResults=false; rec.continuous=false;
  rec.onstart = ()=>{ setMic(true); status('👂 듣고 있어요... 나라 이름을 말해 주세요!'); };
  rec.onend = ()=>{ want=false; setMic(false); };   // 한 번 듣고 자동으로 멈춤
  rec.onerror = e=>{
    if(e.error==='no-speech') status('소리가 안 들렸어요. 🎤를 다시 눌러 볼까요?');
    else if(e.error!=='aborted' && e.error!=='not-allowed' && e.error!=='service-not-allowed' && e.error!=='network') status('다시 한 번 말해 주세요!');
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){ want=false; refresh(); setMic(false); status('마이크를 허용해 주세요 🙏 (주소창 왼쪽 자물쇠)'); }
    else if(e.error==='network'){ want=false; refresh(); setMic(false); status('인터넷이 필요해요 📶'); }
  };
  rec.onresult = e=>{
    if(speaking>0 || Date.now()<muteUntil) return;   // 앱이 말하는 소리는 무시
    const r = e.results[e.results.length-1];
    const texts = Array.from(r).map(a=>a.transcript);
    const c = findCountry(texts);
    if(c) show(c);
    else{
      status('"'+texts[0]+'" 나라를 못 찾았어요. 다시 말해 볼까요?');
      speak('다시 한 번 말해 줄래요?','ko-KR');
    }
  };
  rec.start();
}

$('mic').onclick = listen;
$('namePane').onclick = ()=>{ if(current && !busy()) speakName(current); };
$('read').onclick = readDesc;
$('random').onclick = ()=> busy() || show(C[Math.floor(Math.random()*C.length)]);

// 나라 둘러보기
$('grid').innerHTML = C.map((c,i)=>[c,i]).sort((a,b)=>a[0][1].localeCompare(b[0][1],'ko')).map(([c,i])=>`<button class="chip" data-i="${i}"><img loading="lazy" src="${flagURL(c[0])}" alt=""><div>${c[1]}</div></button>`).join('');
$('browse').onclick = ()=>{ if(!busy()) $('sheet').classList.add('open'); };
$('stop').onclick = ()=>{ want=false; rec && rec.stop(); setMic(false); stopSpeak(); status('⏹ 멈췄어요. 🎤를 누르면 다시 시작해요'); };
$('closeSheet').onclick = ()=> $('sheet').classList.remove('open');
$('grid').onclick = e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  $('sheet').classList.remove('open');
  show(C[+b.dataset.i]);
};
